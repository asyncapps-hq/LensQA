<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">LensQA architecture</title>
  <desc id="desc">Developers trigger GitHub Actions and the LensQA runner. The runner tests a storefront and sends results to the ingest API, Supabase, and private artifact storage. Reviewers use the Next.js dashboard.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1020"/>
      <stop offset="1" stop-color="#141827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d7cff"/>
      <stop offset="1" stop-color="#27e0c2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8d98b8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>

  <rect width="1100" height="430" rx="22" fill="url(#background)"/>
  <text x="42" y="52" fill="#f4f1ff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700">LensQA Frontend Quality Cloud</text>
  <text x="42" y="78" fill="#9b96b0" font-family="Segoe UI, sans-serif" font-size="14">Deterministic execution, secure ingestion, and collaborative review</text>

  <g stroke="#8d98b8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M190 160 H275"/>
    <path d="M445 160 H530"/>
    <path d="M700 160 H775"/>
    <path d="M615 200 V268"/>
    <path d="M190 330 H275"/>
    <path d="M445 330 H530"/>
    <path d="M700 330 H775"/>
    <path d="M445 350 C560 405 650 387 775 387"/>
  </g>

  <g font-family="Segoe UI, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g>
      <rect x="40" y="120" width="150" height="80" rx="14" fill="#191e31" stroke="#3b4567"/>
      <text x="115" y="153" fill="#9b96b0" font-size="12">SOURCE</text>
      <text x="115" y="177" fill="#f4f1ff" font-size="16" font-weight="700">Developer</text>
    </g>
    <g>
      <rect x="275" y="120" width="170" height="80" rx="14" fill="#191e31" stroke="#3b4567"/>
      <text x="360" y="153" fill="#9b96b0" font-size="12">CI</text>
      <text x="360" y="177" fill="#f4f1ff" font-size="16" font-weight="700">GitHub Actions</text>
    </g>
    <g>
      <rect x="530" y="120" width="170" height="80" rx="14" fill="url(#accent)" stroke="#87fff0"/>
      <text x="615" y="153" fill="#101426" font-size="12">EXECUTION</text>
      <text x="615" y="177" fill="#080b16" font-size="16" font-weight="800">LensQA Runner</text>
    </g>
    <g>
      <rect x="775" y="120" width="170" height="80" rx="14" fill="#191e31" stroke="#3b4567"/>
      <text x="860" y="153" fill="#9b96b0" font-size="12">TARGET</text>
      <text x="860" y="177" fill="#f4f1ff" font-size="16" font-weight="700">Demo Store</text>
    </g>
    <g>
      <rect x="530" y="268" width="170" height="80" rx="14" fill="#191e31" stroke="#6d7cff"/>
      <text x="615" y="301" fill="#9b96b0" font-size="12">RESULTS</text>
      <text x="615" y="325" fill="#f4f1ff" font-size="16" font-weight="700">Ingest API</text>
    </g>
    <g>
      <rect x="775" y="268" width="170" height="80" rx="14" fill="#191e31" stroke="#27e0c2"/>
      <text x="860" y="301" fill="#9b96b0" font-size="12">DATA</text>
      <text x="860" y="325" fill="#f4f1ff" font-size="16" font-weight="700">Supabase</text>
    </g>
    <g>
      <rect x="40" y="290" width="150" height="80" rx="14" fill="#191e31" stroke="#3b4567"/>
      <text x="115" y="323" fill="#9b96b0" font-size="12">TEAM</text>
      <text x="115" y="347" fill="#f4f1ff" font-size="16" font-weight="700">Reviewer</text>
    </g>
    <g>
      <rect x="275" y="290" width="170" height="80" rx="14" fill="#191e31" stroke="#6d7cff"/>
      <text x="360" y="323" fill="#9b96b0" font-size="12">REVIEW</text>
      <text x="360" y="347" fill="#f4f1ff" font-size="16" font-weight="700">Next.js Dashboard</text>
    </g>
    <g>
      <rect x="775" y="365" width="170" height="44" rx="12" fill="#191e31" stroke="#3b4567"/>
      <text x="860" y="393" fill="#f4f1ff" font-size="14" font-weight="700">Private Artifacts</text>
    </g>
  </g>

  <text x="1055" y="408" fill="#626b87" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="end">LensQA by KhyFee</text>
</svg>
