name: Visual Tests
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      regression:
        description: 'Run deliberate regression demo'
        required: false
        default: 'false'
jobs:
  playwright:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - name: Install
        run: npm ci
      - name: Build shared
        run: npm run build -w @lensqa/shared
      - name: Run tests
        env:
          LENSQA_REGRESSION: ${{ github.event.inputs.regression == 'true' && '1' || '0' }}
          CI: '1'
        run: npm run test -w @lensqa/runner
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            packages/runner/playwright-report/
            packages/runner/test-results/
          retention-days: 14
