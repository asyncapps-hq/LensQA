name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build -w @lensqa/shared
      - run: npm run test -w @lensqa/shared
      - run: npm run typecheck --workspaces --if-present
      - run: npm run build -w @lensqa/web
