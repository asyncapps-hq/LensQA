name: Feature request
description: Propose a concrete LensQA improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What user or workflow problem needs solving?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed outcome
      description: Describe the smallest useful result, not only an implementation.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
  - type: checkboxes
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement this.
