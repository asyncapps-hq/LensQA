name: Bug report
description: Report a reproducible LensQA problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible steps or repository.
    validations:
      required: true
  - type: input
    attributes:
      label: LensQA version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Component
      options:
        - Dashboard
        - Playwright runner
        - Demo store
        - Supabase schema
        - SDK
        - Browser extension
        - CI or Docker
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs or screenshots
      description: Remove secrets and private customer data first.
